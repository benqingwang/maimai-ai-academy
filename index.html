<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麦麦 AI 学院</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#193c34;font:16px/1.75 system-ui,-apple-system,sans-serif}header{background:#153e35;color:white;padding:18px 5%}header h1{margin:0;font-size:24px}nav{display:flex;gap:8px;overflow:auto;padding:12px 5%;background:#e4f1e9}button{border:1px solid #b2cfc0;border-radius:10px;padding:10px 14px;background:white;color:#164b3e;cursor:pointer;white-space:nowrap;font:inherit}button.active,.primary{background:#176e58;color:white}main{max-width:880px;margin:auto;padding:20px}article{background:white;border:1px solid #dae7dd;border-radius:16px;padding:clamp(18px,4vw,36px)}h2{font-size:clamp(25px,4vw,35px);line-height:1.3}h3{margin-top:30px}.math{padding:16px;background:#edf6f0;border-radius:10px;overflow:auto;font-family:Georgia,serif;font-size:18px}.note{background:#fff8e8;border-left:4px solid #d4a349;padding:12px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.bars{display:flex;align-items:end;gap:16px;height:170px;border-bottom:1px solid #aaa}.barwrap{flex:1;text-align:center;font-size:13px}.bar{background:#369e7b;border-radius:6px 6px 0 0}.muted{color:#617e72;font-size:14px}input{width:min(100%,350px)}@media(max-width:600px){nav{padding:10px}main{padding:12px}header{padding:14px}}</style></head>
<body><header><h1>🐶 麦麦 AI 学院</h1><div>Learn AI from First Principles · Week 1</div></header><nav id="nav"></nav><main><article id="content"></article><div class="controls" id="controls"></div><p class="muted">v0.1 学习网站初版 · 课程内容是提纲版，尚未替代正式教材 · 进度仅存本设备</p></main>
<script>
const lessons=[
['Lesson 1 · 基础','从文字到 Attention',`<h3>Tokenization</h3><p>Text → Tokens → Token IDs</p><h3>Embedding + Position</h3><div class="math">E = Embedding(Token IDs)<br>X = E + P</div><p>X 是第一个 Attention 子层的输入；这里采用经典加法位置编码示例。</p><h3>Q / K / V</h3><div class="math">Q = XW<sub>Q</sub><br>K = XW<sub>K</sub><br>V = XW<sub>V</sub></div><p>W<sub>Q</sub>、W<sub>K</sub>、W<sub>V</sub> 是可训练投影矩阵。</p><h3>Single-Head Attention</h3><div class="math">S = QK<sup>T</sup>/√d<sub>k</sub><br>A = softmax(S + M)<br>O<sub>i</sub> = AV</div><p>S = Attention Scores；M = Mask；A = Attention Weights；O<sub>i</sub> = Individual Head Output。</p>`],
['Lesson 2 · 深入','Softmax、Mask 与 Multi-Head',`<h3>Softmax</h3><div class="math">softmax(z)<sub>i</sub> = exp(z<sub>i</sub>)/Σ exp(z<sub>j</sub>)</div><p>每行先减最大值，再 exp 和归一化，提高数值稳定性。</p><h3>Causal Mask</h3><p>将未来 Token 的 Score 设为 −∞，Softmax 后权重为 0。Causal Mask 不等于 Positional Encoding。</p><h3>Multi-Head Attention：固定术语</h3><div class="math">O<sub>i</sub> = Individual Head Output<br>C = Concat(O<sub>1</sub>, …, O<sub>h</sub>)<br>O = CW<sub>O</sub></div><p>C = Concatenated Head Outputs；O = Multi-Head Attention Output；W<sub>O</sub> = 可训练的 Output Projection Matrix。</p><h3>Softmax 交互实验</h3><p>固定 Logits [2,1,0]，改变 Temperature T：</p><label>T = <b id="tv">1.0</b>　<input id="temp" type="range" min="0.2" max="3" step="0.1" value="1"></label><div class="bars" id="bars"></div><p class="muted">T 越小分布越尖锐；越大越平坦。</p>`],
['Lesson 3 · Block','从 MHA 到 Transformer Block',`<p class="note">严格衔接上一课：先从 O = CW<sub>O</sub> 出发。本页采用经典 Post-LN 架构；其他架构 LayerNorm 位置可能不同。</p><h3>昨天的终点：MHA Output</h3><div class="math">C = Concat(O<sub>1</sub>, …, O<sub>h</sub>)<br>O = CW<sub>O</sub></div><p>X 仍是该 Attention 子层的输入；第一个 Block 的经典示例中 X = E + P。</p><h3>Residual Connection</h3><div class="math">R = X + O</div><p>R = Residual Sum，把输入 X 加回 Attention 输出 O。</p><h3>LayerNorm</h3><div class="math">H = LayerNorm(R)</div><p>对每个 Token 的特征分别标准化，再进行可学习的逐特征 Scale γ 与 Shift β。H = FFN Input，不是 Heads。</p><div class="math">r̂<sub>j</sub> = (r<sub>j</sub> − μ)/√(σ² + ε)<br>h<sub>j</sub> = γ<sub>j</sub>r̂<sub>j</sub> + β<sub>j</sub></div><h3>Feed-Forward Network</h3><div class="math">FFN(H) = φ(HW<sub>1</sub> + b<sub>1</sub>)W<sub>2</sub> + b<sub>2</sub></div><p>φ 是非线性激活函数，如 ReLU；W 是可训练权重，b 是 Bias。FFN 对每个 Token 独立应用相同参数。</p><h3>Block Output</h3><div class="math">Y = LayerNorm(H + FFN(H))</div><p>完整 GPT 类模型：Embedding → Transformer Blocks × L → Final Norm（视架构）→ LM Head → Logits → Softmax（用于概率）。</p>`],
['🦴 知识骨头库','待整理的知识骨头卡',`<h3>术语统一</h3><p>Individual Head Outputs O<sub>i</sub> → Concatenated Head Outputs C → Multi-Head Attention Output O = CW<sub>O</sub>。</p><h3>Positional Encoding</h3><p>后续深入 Sin/Cos、X=E+P、相加与拼接的区别、RoPE 和 Causal Mask。</p><h3>Softmax</h3><p>数学定义、平移不变、稳定计算、Temperature 与 1/√d<sub>k</sub> 的区别。</p><h3>教学连续性</h3><p>新符号必须定义名称、作用、Shape，并明确与前一课的连接。</p>`]
];
let current=0,done={};try{done=JSON.parse(localStorage.getItem('maimai-progress')||'{}')}catch(e){}
function show(i){current=i;document.getElementById('nav').innerHTML=lessons.map((l,j)=>`<button class="${i===j?'active':''}" onclick="show(${j})">${l[0]}${done[j]?' ✓':''}</button>`).join('');document.getElementById('content').innerHTML=`<h2>${lessons[i][1]}</h2>${lessons[i][2]}`;document.getElementById('controls').innerHTML=`${i>0?`<button onclick="show(${i-1})">← 上一课</button>`:''}${i<3?`<button class="primary" onclick="show(${i+1})">下一课 →</button>`:''}${i<3?`<button onclick="mark()">${done[i]?'取消完成':'标记完成 ✓'}</button>`:''}`;if(i===1){const s=document.getElementById('temp');function update(){const t=+s.value,e=[2,1,0].map(x=>Math.exp((x-2)/t)),sum=e.reduce((a,b)=>a+b,0);document.getElementById('tv').textContent=t.toFixed(1);document.getElementById('bars').innerHTML=e.map((v,j)=>`<div class="barwrap">${(v/sum*100).toFixed(1)}%<div class="bar" style="height:${Math.max(2,v/sum*130)}px"></div>Logit ${2-j}</div>`).join('')}s.oninput=update;update()}location.hash='lesson'+(i+1);window.scrollTo(0,0)}
function mark(){done[current]=!done[current];try{localStorage.setItem('maimai-progress',JSON.stringify(done))}catch(e){}show(current)}
show(Math.max(0,Math.min(3,(parseInt(location.hash.replace('#lesson',''))||1)-1)));
</script></body></html>
